name = "CharacteristicSetBridge"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CharacteristicSetBridge"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true

[[lean_lib]]
name = "CharacteristicSetBridge"
globs = ["CharacteristicSetBridge.*"]

[[require]]
name = "CharacteristicSet"
path = "../.."

[[require]]
name = "CharacteristicSetTheory"
path = "../theory"

# Override Hex theory's older Mathlib pin with the project's fixed release.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "HexMvPolyTheory"
git = "https://github.com/leanprover/hex-mv-poly-theory.git"
rev = "cca4bb9172ecdd1b988b09a82e1653cfa4ed78cd"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.35.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"
